<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Store Checkout System</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    padding: 20px 25px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  h1 {
    text-align: center;
    color: #2c3e50;
    font-size: 22px;
  }
  label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
    color: #333;
  }
  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .product-block {
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px 15px;
    margin-top: 15px;
    background: #fafafa;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: #2c7be5;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover {
    background: #1a5fc4;
  }
  #validationMessage {
    color: #c0392b;
    font-weight: bold;
    margin-top: 10px;
    white-space: pre-line;
  }
  #orderSummary {
    margin-top: 20px;
    background: #eef6ff;
    padding: 15px;
    border-radius: 6px;
    white-space: pre-line;
    font-family: "Courier New", monospace;
  }
</style>
</head>
<body>

<div class="container">
  <h1>MINI STORE CHECKOUT SYSTEM</h1>

  <label for="customerName">Customer Name</label>
  <input type="text" id="customerName" placeholder="Enter customer name" />

  <label for="productCount">Number of Products</label>
  <input type="number" id="productCount" placeholder="Enter number of products" min="1" />

  <div id="productsContainer"></div>

  <label for="deliveryOption">Delivery Option</label>
  <select id="deliveryOption">
    <option value="1">1 - Store Pickup</option>
    <option value="2">2 - Standard Delivery</option>
    <option value="3">3 - Express Delivery</option>
  </select>

  <div id="validationMessage"></div>

  <button type="button" id="calculateBtn">Calculate Order</button>

  <div id="orderSummary"></div>
</div>

<script src="script.js"></script>
</body>
</html>
